<svg width="1200" height="120" viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="footer waves">
  <defs>
    <linearGradient id="f1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8C4CF2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8C4CF2" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="f2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4C8CF2" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#33D9F2" stop-opacity="0.1"/>
    </linearGradient>
    <clipPath id="fframe"><rect width="1200" height="120" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#fframe)" transform="translate(0,120) scale(1,-1)">
    <g transform="translate(0,45)">
      <path fill="url(#f1)" d="M0 40 Q75 10 150 40 T300 40 T450 40 T600 40 T750 40 T900 40 T1050 40 T1200 40 T1350 40 T1500 40 V120 H0 Z">
        <animateTransform attributeName="transform" type="translate" values="0 0; -300 0" dur="12s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(0,25)">
      <path fill="url(#f2)" d="M0 45 Q75 15 150 45 T300 45 T450 45 T600 45 T750 45 T900 45 T1050 45 T1200 45 T1350 45 T1500 45 V140 H0 Z">
        <animateTransform attributeName="transform" type="translate" values="-300 0; 0 0" dur="8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
