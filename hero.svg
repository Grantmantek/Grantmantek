<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Grant Mantek — design-driven front-end">
  <defs>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#33D9F2"/>
      <stop offset="50%" stop-color="#4C8CF2"/>
      <stop offset="100%" stop-color="#8C4CF2"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8C4CF2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8C4CF2" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33D9F2" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#33D9F2" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4C8CF2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050A21" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#050A21"/>

    <!-- drifting stars -->
    <g fill="#C9D1D9">
      <circle cx="90" cy="60" r="1.6"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="240" cy="140" r="1.2"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="410" cy="50" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="40" r="1.3"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="120" r="1.6"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="1010" cy="70" r="1.2"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="1130" cy="150" r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="540" cy="100" r="1.1"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.4s" repeatCount="indefinite"/></circle>
    </g>

    <text x="600" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#txt)">Grant Mantek</text>
    <text x="600" y="184" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#C9D1D9">design-driven front-end &#183; React &#183; TypeScript &#183; Three.js &#183; GLSL</text>
    <text x="600" y="214" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#8B949E">building from a 942-note design brain</text>

    <!-- animated waves -->
    <g transform="translate(0,200)">
      <path fill="url(#w1)" d="M0 60 Q75 30 150 60 T300 60 T450 60 T600 60 T750 60 T900 60 T1050 60 T1200 60 T1350 60 T1500 60 V160 H0 Z">
        <animateTransform attributeName="transform" type="translate" values="0 0; -300 0" dur="14s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(0,215)">
      <path fill="url(#w2)" d="M0 55 Q75 20 150 55 T300 55 T450 55 T600 55 T750 55 T900 55 T1050 55 T1200 55 T1350 55 T1500 55 V150 H0 Z">
        <animateTransform attributeName="transform" type="translate" values="-300 0; 0 0" dur="10s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(0,235)">
      <path fill="url(#w3)" d="M0 50 Q75 15 150 50 T300 50 T450 50 T600 50 T750 50 T900 50 T1050 50 T1200 50 T1350 50 T1500 50 V120 H0 Z">
        <animateTransform attributeName="transform" type="translate" values="0 0; -300 0" dur="7s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
