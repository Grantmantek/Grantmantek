<svg width="1200" height="190" viewBox="0 0 1200 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Design and Code vault stats">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#33D9F2"/>
      <stop offset="50%" stop-color="#4C8CF2"/>
      <stop offset="100%" stop-color="#8C4CF2"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#33D9F2"/>
      <stop offset="100%" stop-color="#4C8CF2"/>
    </linearGradient>
  </defs>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- card 1 -->
    <rect x="1" y="10" width="386" height="170" rx="14" fill="#0A1130" stroke="url(#edge)" stroke-width="1.5"/>
    <text x="194" y="88" text-anchor="middle" font-size="46" font-weight="800" fill="url(#num)">942</text>
    <text x="194" y="120" text-anchor="middle" font-size="17" font-weight="600" fill="#C9D1D9">vault notes</text>
    <text x="194" y="146" text-anchor="middle" font-size="13" fill="#8B949E">one growing Obsidian design brain</text>

    <!-- card 2 -->
    <rect x="407" y="10" width="386" height="170" rx="14" fill="#0A1130" stroke="url(#edge)" stroke-width="1.5"/>
    <text x="600" y="88" text-anchor="middle" font-size="46" font-weight="800" fill="url(#num)">4,539</text>
    <text x="600" y="120" text-anchor="middle" font-size="17" font-weight="600" fill="#C9D1D9">captured components</text>
    <text x="600" y="146" text-anchor="middle" font-size="13" fill="#8B949E">8 React registries + 3,802 UIverse elements</text>

    <!-- card 3 -->
    <rect x="813" y="10" width="386" height="170" rx="14" fill="#0A1130" stroke="url(#edge)" stroke-width="1.5"/>
    <text x="1006" y="88" text-anchor="middle" font-size="46" font-weight="800" fill="url(#num)">134</text>
    <text x="1006" y="120" text-anchor="middle" font-size="17" font-weight="600" fill="#C9D1D9">ReactBits notes</text>
    <text x="1006" y="146" text-anchor="middle" font-size="13" fill="#8B949E">full code &#183; props tables &#183; install steps</text>
  </g>
</svg>
